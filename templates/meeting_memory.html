<!doctype html><html><head><meta charset="utf-8"><title>Meeting Memory — {{ version }}</title><style>body{font-family:Arial,sans-serif;max-width:950px;margin:28px auto;padding:0 18px;color:#0b1b35}.card{border:1px solid #d9e2ef;border-radius:14px;padding:20px}.note{background:#eaf3ff;padding:14px;border-radius:10px}textarea,input{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px}button{background:#111c33;color:white;border:0;border-radius:8px;padding:11px 16px;margin:6px 6px 6px 0}pre{background:#f5f7fa;padding:16px;white-space:pre-wrap}</style></head><body><div class="card"><h1>Meeting Memory — {{ version }}</h1><p>Store bounded structured outcomes without storing the raw transcript, meeting link, credentials or participant identity.</p><div class="note"><b>Privacy:</b> This acceptance page uses synthetic in-memory storage only.</div><label>Summary</label><textarea id="summary">Synthetic handover meeting completed successfully.</textarea><label>Decision</label><input id="decision" value="Use option B"><label>Action item</label><input id="action" value="Prepare closeout list"><button onclick="run('save')">Save Synthetic Memory</button><button onclick="run('recall')">Recall Synthetic Memory</button><pre id="out">Ready.</pre><p><a href="/acquisition">Back to Acquisition Center</a></p></div><script>async function run(mode){let body={mode,summary:document.getElementById('summary').value,decisions:[document.getElementById('decision').value],action_items:[document.getElementById('action').value],query:'handover'};let r=await fetch('/api/meeting-memory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2);}</script></body></html>
