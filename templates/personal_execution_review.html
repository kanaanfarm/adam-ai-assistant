<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adam Execution Review</title><style>body{font-family:Arial;background:#f3f6fa;margin:0;padding:30px}.card{max-width:850px;margin:0 auto 14px;background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 8px #0001}textarea{width:100%;min-height:110px;box-sizing:border-box;padding:12px}button,a{background:#111c2d;color:#fff;border:0;border-radius:6px;padding:10px 14px;text-decoration:none;cursor:pointer}pre{white-space:pre-wrap;background:#f6f8fa;padding:14px;border-radius:8px}.approve{margin:14px 0}</style></head><body><div class="card"><h2>Adam {{ version }} — Personal Execution Review</h2><p>Prepare a real-assistant action for review. Consequential actions remain blocked until Owner Approval. This acceptance screen does not execute a real connector.</p><textarea id="req" placeholder="Example: Prepare an email to the contractor and schedule a meeting tomorrow."></textarea><div class="approve"><label><input id="approved" type="checkbox"> Owner Approval</label></div><button onclick="run()">Prepare / Review</button> <a href="/daily-assistant-workflow">Daily Workflow</a></div><div class="card"><h3>Execution Review</h3><pre id="out">No action prepared yet.</pre></div><script>async function run(){let r=await fetch('/api/personal-assistant/execution-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request:document.getElementById('req').value,owner_approved:document.getElementById('approved').checked})});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
