<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales — {{ app_name }}</title>
<style>:root{font-family:Arial,sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 5px 18px rgba(17,24,39,.04)}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin:8px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd2dc;border-radius:8px;font:inherit}textarea{min-height:125px;resize:vertical}.reply{min-height:190px}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:13px}button,.btn{padding:10px 14px;border:1px solid #c8ced8;border-radius:8px;background:#fff;color:#111827;text-decoration:none;cursor:pointer;font-weight:700}.primary{background:#111827;color:#fff;border-color:#111827}.status{display:none;margin-top:12px;padding:10px;border-radius:8px}.good{display:block;background:#ecfdf3;color:#067647}.bad{display:block;background:#fef3f2;color:#b42318}.warn{display:block;background:#fffaeb;color:#b54708}.small{font-size:13px;color:#6b7280}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><div class="wrap"><div class="card"><h1>Sales Assistant</h1><div class="small">Adam prepares multilingual customer replies using only facts, prices and limits approved by you. Nothing is sent without your approval.</div><div class="actions"><a class="btn" href="/">← Back to Assistant</a><a class="btn" href="/whatsapp">WhatsApp Settings</a></div></div>
<div class="card"><h2>1. Customer Request</h2><div class="grid">
<div><label>Customer name</label><input id="customerName" placeholder="Customer name"></div><div><label>WhatsApp number</label><input id="phone" placeholder="International format, e.g. 9715XXXXXXXX"></div>
<div><label>Reply language</label><select id="language"><option>English</option><option>Arabic</option><option>Lebanese Arabic</option><option>French</option><option>Spanish</option></select></div><div><label>Channel</label><select id="channel"><option>WhatsApp</option><option>Email</option><option>Phone follow-up</option></select></div>
<div class="full"><label>Customer inquiry</label><textarea id="inquiry" placeholder="Paste or summarize what the customer asked"></textarea></div>
<div class="full"><label>Owner-approved facts, price, warranty, delivery and maximum discount</label><textarea id="facts" placeholder="Enter only information Adam is permitted to use. Leave unknown items blank."></textarea></div></div>
<div class="actions"><button class="primary" id="draftBtn">Prepare Sales Reply</button></div><div id="draftStatus" class="status"></div></div>
<div class="card"><h2>2. Owner Review</h2><label>Proposed reply</label><textarea class="reply" id="reply"></textarea><div class="check"><input id="approve" type="checkbox"><label for="approve" style="margin:0">I reviewed and approve this exact customer reply</label></div><div class="actions"><button id="copyBtn">Copy Approved Reply</button><button class="primary" id="sendBtn">Send Approved Reply by WhatsApp</button></div><div id="sendStatus" class="status"></div></div></div>
<script>const q=id=>document.getElementById(id);let sent=false;['reply','phone'].forEach(id=>q(id).addEventListener('input',()=>{sent=false;q('approve').checked=false}));
q('draftBtn').onclick=async()=>{const out=q('draftStatus');out.className='status warn';out.textContent='Preparing sales reply…';try{const r=await fetch('/api/sales/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_name:q('customerName').value,inquiry:q('inquiry').value,approved_facts:q('facts').value,language:q('language').value,channel:q('channel').value})});const d=await r.json();if(!d.ok)throw new Error(d.error||'Draft failed');q('reply').value=d.reply||'';q('approve').checked=false;sent=false;out.className='status good';out.textContent='Draft ready for owner review.'}catch(e){out.className='status bad';out.textContent='Error: '+e.message}};
q('copyBtn').onclick=async()=>{const out=q('sendStatus');if(!q('approve').checked){out.className='status bad';out.textContent='Approve the exact reply before copying.';return}await navigator.clipboard.writeText(q('reply').value);out.className='status good';out.textContent='Approved reply copied.'};
q('sendBtn').onclick=async()=>{const out=q('sendStatus');if(sent){out.className='status warn';out.textContent='This reply was already submitted. Edit it before sending again.';return}if(!q('approve').checked){out.className='status bad';out.textContent='Owner approval is required.';return}if(!confirm('Send this approved sales reply by WhatsApp now?'))return;try{const r=await fetch('/api/sales/send-whatsapp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved:true,phone:q('phone').value,message:q('reply').value})});const d=await r.json();if(!d.ok)throw new Error(d.error||'Send failed');sent=true;q('approve').checked=false;out.className='status good';out.textContent='Reply accepted by Meta. Delivery is pending.'}catch(e){out.className='status bad';out.textContent='Error: '+e.message}};</script></body></html>
