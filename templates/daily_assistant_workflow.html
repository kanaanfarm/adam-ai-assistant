<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adam Daily Assistant Workflow</title><style>body{font-family:Arial;background:#f3f6fa;margin:0;padding:30px}.card{max-width:850px;margin:0 auto 14px;background:white;padding:22px;border-radius:12px;box-shadow:0 2px 8px #0001}textarea{width:100%;min-height:110px;box-sizing:border-box;padding:12px}button,a{background:#111c2d;color:white;border:0;border-radius:6px;padding:10px 14px;text-decoration:none;cursor:pointer}pre{white-space:pre-wrap;background:#f6f8fa;padding:14px;border-radius:8px}</style></head><body><div class="card"><h2>Adam {{ version }} — Daily Assistant Workflow</h2><p>Describe one daily task. Adam will understand it, create a multi-step plan, and identify where Owner Approval is required before consequential execution.</p><textarea id="req" placeholder="Example: Prepare an email to the contractor and schedule a meeting tomorrow."></textarea><br><br><button onclick="plan()">Prepare Plan</button> <a href="/personal-assistant-readiness">Readiness</a></div><div class="card"><h3>Workflow Result</h3><pre id="out">No plan prepared yet.</pre></div><script>async function plan(){let r=await fetch('/api/personal-assistant/daily-workflow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request:document.getElementById('req').value})});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
